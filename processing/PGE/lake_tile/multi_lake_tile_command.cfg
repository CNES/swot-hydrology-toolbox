[PATHS]
# param_file is optionnal, if not set, default parameter file from swotCNES will be used
param_file = ./lake_tile_param.cfg
PIXC directory = /work/SWOT/swotdev/swotpub/JENKINS/DATA_LAKE_TEST/FT2_Cas1/2_sisimp
PIXCVecRiver directory = /work/SWOT/swotdev/swotpub/JENKINS/DATA_LAKE_TEST/FT2_Cas1/2_sisimp
Output directory = TEST/output

[DATABASES]

##### Lake database #####

# OPTION 1: upper directory pointing to operational Prior Lake Database (PLD)
LAKE_DB = /work/SWOT/swotdev/swotpub/BD/BD_lakes/PLD

# OPTION 2: lake database in SQLite format
# 2.1 - Filename starts with SWOT_PLD_ = operational Prior Lake Database (PLD)
# 2.2 - Filename doesn't start with SWOT_PLD = personal lake database with model similar to operational PLD 
#       ie containing the following tables: lake, lake_influence, basin
#LAKE_DB = /work/SWOT/swotdev/swotpub/BD/BD_lakes/PLD/Cal/SWOT_LakeDatabase_Cal_001_20000101T000000_20991231T235959_20211103T133032_v001.sqlite
#LAKE_DB = /work/SWOT/swotdev/swotpub/BD/BD_lakes/PLD/Nom/SWOT_LakeDatabase_Nom_001_20000101T000000_20991231T235959_20211103T133032_v001.sqlite

# OPTION 3 : lake database in shapefile format
# Filename
# LAKE_DB = /work/SWOT/swotdev/swotpub/BD/BD_lakes/20200702_PLD/PLD_EU.shp
# Lake identifier attribute name in the prior lake database and influence_lake_db
# LAKE_DB_ID = lake_id

##### Mean lake surfaces database #####

# OPTION 1: upper directory pointing to operational Mean Lake Surfaces (MLS)
MLS = /work/SWOT/swotdev/swotpub/BD/MLS/MLS_v001

# OPTION 2: MLS files stored in a TAR 
# Filename should starts with SWOT_MeanLakeSurface_ = operational Mean Lake Surfaces (MLS)
#MLS = /work/SWOT/swotdev/swotpub/BD/MLS/MLS_v001/Cal/SWOT_MeanLakeSurface_Cal_001_20000101T000000_20991231T235959_20261111T120000_v001.tar
#MLS = /work/SWOT/swotdev/swotpub/BD/MLS/MLS_v001/Nom/SWOT_MeanLakeSurface_Nom_001_20000101T000000_20991231T235959_20261111T120000_v001.tar

[UDES_ICE]
# Pre-trained ice classification model used to compute ice_dyn_f
ICE_MODEL = /work/SWOT/swotdev/swotpub/BD/UdeS_model_4ice/SWOT_IceDynF_Model_20000101T000000_20991231T235959_20260611T000000_v100.joblib

[TILES_INFOS]
# Format = int; if empty, deal with all PixC files in PIXC directory
#Cycle number = 
# Format = int; if empty, deal with all PixC files of the cycle defined above in PIXC directory
#Pass number = 
# Tile number (ttt) and swath (s) in string format ("ttts"); if empty, deal with all PixC files of cycle "Cycle" and pass "Pass" in PIXC directory
#Tile ref = 

[OPTIONS]
# Input PIXC and PIXCVecRiver files are simulated data or not (default)
Simulated data = False
# To also produce LakeTile_Edge and LakeTile_PIXCVec as shapefiles (=True); else=False (default)
Produce shp = True
# To save intermediate data for detailed investigation or not (default)
Save intermediate data = False
# To increment the file counter in the output filenames (=True, default); else=False
Increment file counter = False
# To write full path in global attributes (=True); to write only basename=False
Write full path = True

[LOGGING]
# Error file full path
errorFile = TEST/output/ErrorFile.log
# Log file full path
logFile = TEST/output/LogFile.log
# Log level put inside the file
logfilelevel = DEBUG
# Is log console output ?
logConsole = True
# Log level print in console
logconsolelevel = DEBUG

[FILE_INFORMATION]
# Name of producing agency
INSTITUTION = CNES
# Product version
PRODUCT_VERSION = Revision C 
# Composite Release IDentifier for LakeTile processing
CRID = PTD0
# Version identifier of the product generation executable (PGE)
PGE_VERSION = 6.2.0
# Contact
CONTACT = test@cnes.fr
